global:
  scrape_interval: 5s       # short runs (experiments are minutes long) need fine-grained samples
  evaluation_interval: 5s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']

  - job_name: kafka-exporter
    static_configs:
      - targets: ['kafka-exporter:9308']

  # Services run on the host as processes; targets are DOWN when not running. Experiments start up to
  # four consumer instances on 8081-8084.
  - job_name: ingest-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['host.docker.internal:8080']

  - job_name: consumer-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['host.docker.internal:8081', 'host.docker.internal:8082', 'host.docker.internal:8083', 'host.docker.internal:8084']
