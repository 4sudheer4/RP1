# RP1 local infra: 3-broker KRaft Kafka, Postgres, Toxiproxy, Prometheus, Grafana.
#
# Listener layout per broker N (1..3):
#   CONTROLLER  :9093   KRaft quorum traffic.
#   INTERNAL    :29092  broker<->broker and in-network tools (kafka-init, kafka-exporter). Advertised kafka-N:29092.
#   PROXIED     :9092   service traffic. Advertised localhost:3909x, which is a Toxiproxy listener -> kafka-N:9092.
#                       Every client hop (bootstrap AND per-partition leader connections) goes through Toxiproxy,
#                       so latency/cut toxics apply to all of a service's broker connections.
#   DIRECT      :9094   host debugging / verification, bypasses Toxiproxy. Advertised localhost:4909x.
#
# Host ports avoid 9092-9094 / 5432 so this stack can run beside other local Kafka/Postgres stacks.

name: rp1

x-kafka-common: &kafka-common
  image: apache/kafka:3.9.0
  restart: "no"   # chaos tests kill brokers on purpose; nothing should silently resurrect them
  healthcheck:
    test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:29092 >/dev/null 2>&1"]
    interval: 5s
    timeout: 10s
    retries: 30
    start_period: 20s

x-kafka-env: &kafka-env
  CLUSTER_ID: rp1-kraft-cluster-0001
  KAFKA_PROCESS_ROLES: broker,controller           # combined mode: fine locally; prod would split controllers
  KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka-1:9093,2@kafka-2:9093,3@kafka-3:9093
  KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
  KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
  KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,PROXIED:PLAINTEXT,DIRECT:PLAINTEXT
  KAFKA_LISTENERS: CONTROLLER://:9093,INTERNAL://:29092,PROXIED://:9092,DIRECT://:9094
  KAFKA_LOG_DIRS: /tmp/kraft-logs                 # container FS: survives kill/start, wiped by `down`
  KAFKA_HEAP_OPTS: -Xms512m -Xmx512m              # 3 brokers must fit in a laptop Docker VM
  # --- durability defaults (topics also set these explicitly in kafka/create-topics.sh) ---
  KAFKA_DEFAULT_REPLICATION_FACTOR: 3             # any topic created without explicit RF still gets 3
  KAFKA_MIN_INSYNC_REPLICAS: 2                    # acks=all needs leader + 1 follower; tolerates 1 broker loss
  KAFKA_UNCLEAN_LEADER_ELECTION_ENABLE: "false"   # never elect an out-of-sync replica (would drop acked data)
  KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"        # typo'd topic names must fail loudly, not create RF-default junk
  KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3       # consumer offsets must survive a broker loss too
  KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
  KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2

services:
  kafka-1:
    <<: *kafka-common
    hostname: kafka-1
    ports: ["49092:9094"]
    environment:
      <<: *kafka-env
      KAFKA_NODE_ID: 1
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka-1:29092,PROXIED://localhost:39092,DIRECT://localhost:49092

  kafka-2:
    <<: *kafka-common
    hostname: kafka-2
    ports: ["49093:9094"]
    environment:
      <<: *kafka-env
      KAFKA_NODE_ID: 2
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka-2:29092,PROXIED://localhost:39093,DIRECT://localhost:49093

  kafka-3:
    <<: *kafka-common
    hostname: kafka-3
    ports: ["49094:9094"]
    environment:
      <<: *kafka-env
      KAFKA_NODE_ID: 3
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka-3:29092,PROXIED://localhost:39094,DIRECT://localhost:49094

  # One-shot: creates topics with explicit RF / min ISR / retention, then exits 0.
  kafka-init:
    image: apache/kafka:3.9.0
    restart: "no"
    depends_on:
      kafka-1: { condition: service_healthy }
      kafka-2: { condition: service_healthy }
      kafka-3: { condition: service_healthy }
    volumes:
      - ./kafka/create-topics.sh:/create-topics.sh:ro
    entrypoint: ["/bin/bash", "/create-topics.sh"]
    environment:
      BOOTSTRAP: kafka-1:29092,kafka-2:29092,kafka-3:29092

  toxiproxy:
    image: ghcr.io/shopify/toxiproxy:2.9.0
    command: ["-host=0.0.0.0", "-config=/config/toxiproxy.json"]
    volumes:
      - ./toxiproxy/toxiproxy.json:/config/toxiproxy.json:ro
    ports:
      - "8474:8474"     # control API
      - "39092:39092"   # -> kafka-1:9092
      - "39093:39093"   # -> kafka-2:9092
      - "39094:39094"   # -> kafka-3:9092
      - "55432:55432"   # -> postgres:5432 (for DB-slowness experiments)
    healthcheck:
      test: ["CMD", "/toxiproxy-cli", "list"]
      interval: 5s
      timeout: 3s
      retries: 10

  postgres:
    image: postgres:16.4-alpine
    environment:
      POSTGRES_DB: rp1
      POSTGRES_USER: rp1
      POSTGRES_PASSWORD: rp1
    ports: ["5442:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rp1 -d rp1"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Topic/partition/ISR/consumer-lag metrics without a JMX agent on the brokers.
  kafka-exporter:
    image: danielqsj/kafka-exporter:v1.8.0
    restart: unless-stopped   # rides out broker kills during chaos runs
    depends_on:
      kafka-init: { condition: service_completed_successfully }
    command:
      - --kafka.server=kafka-1:29092
      - --kafka.server=kafka-2:29092
      - --kafka.server=kafka-3:29092
    ports: ["9308:9308"]

  prometheus:
    image: prom/prometheus:v2.54.1
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports: ["9090:9090"]
    extra_hosts: ["host.docker.internal:host-gateway"]   # services run on the host in stages 2-3
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:9090/-/healthy"]
      interval: 5s
      timeout: 3s
      retries: 10

  grafana:
    image: grafana/grafana:11.2.0
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports: ["3000:3000"]
    depends_on:
      prometheus: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:3000/api/health"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
